name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Space'e yükle
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SPACE_ID: ismailylmz283/arxiv-rag
      SPACE_URL: https://ismailylmz283-arxiv-rag.hf.space
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Anahtarı kontrol et
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN tanımlı değil: repo -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e . huggingface_hub==2.2.0
      - name: Arayüzü derle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Kuyruğun boşalmasını bekle
        run: python -m scripts.deploy.wait_live idle --url "$SPACE_URL" --timeout 2400
      - name: Space'e yükle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m scripts.deploy.build_space --push "$SPACE_ID" --commit "$DEPLOY_SHA"
      - name: Yeni sürümün yayına girmesini bekle
        run: python -m scripts.deploy.wait_live live --url "$SPACE_URL" --commit "$DEPLOY_SHA" --timeout 3000
